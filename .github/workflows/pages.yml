# Publishes site/ to GitHub Pages. workflow_dispatch only: a push to main must
# not put the buy page online before the notarized DMG is the Latest release.
# Setup is in docs/GO_LIVE.md. Source must be "GitHub Actions" in the repo's
# Pages settings. Branch deploys cannot serve the site/ directory.
name: Deploy site

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
